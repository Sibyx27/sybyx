<script>
// Thème : auto (réglage de l'appareil), soir (sombre de 19 h à 7 h), clair, sombre
(function(){var m="auto";try{m=localStorage.getItem("bbs3:theme")||"auto"}catch(e){}
  window.themeApplique=function(mode){var h=new Date().getHours(),t=mode==="clair"?"light":mode==="sombre"?"dark":mode==="soir"?((h>=19||h<7)?"dark":"light"):null;
    if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");
  };
  themeApplique(m);})();
</script>

<style>
/* Layout : appli de salon une colonne + barre d'onglets fixée en bas, papier porcelaine / encre marine / rouge enseigne de barbier */
:root{
  --fond:#F3F4F6; --surface:#FFFFFF; --ligne:#DADDE4; --encre:#121318; --encre-2:#474B57; --encre-3:#878C99;
  --rouge:#C8102E; --rouge-doux:rgba(200,16,46,.09); --bleu:#1D4E89; --ok:#1E8A4C; --ok-doux:rgba(30,138,76,.12); --alerte:#B45309;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fond:#0E1322; --surface:#161D31; --ligne:#27304A; --encre:#EEF1F7; --encre-2:#B4BCD0; --encre-3:#7A849C;
  --rouge:#FF4D5E; --rouge-doux:rgba(255,77,94,.13); --bleu:#7FB0F0; --ok:#4CC27E; --ok-doux:rgba(76,194,126,.14); --alerte:#F0A040; color-scheme:dark}}
:root[data-theme="dark"]{
  --fond:#0E1322; --surface:#161D31; --ligne:#27304A; --encre:#EEF1F7; --encre-2:#B4BCD0; --encre-3:#7A849C;
  --rouge:#FF4D5E; --rouge-doux:rgba(255,77,94,.13); --bleu:#7FB0F0; --ok:#4CC27E; --ok-doux:rgba(76,194,126,.14); --alerte:#F0A040; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--fond);color:var(--encre)}
body{font-family:var(--body);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0 170px;max-width:580px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--rouge);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--encre);background:var(--surface);border:1px solid var(--ligne);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.num{font-variant-numeric:tabular-nums}

header .theme{margin-left:auto;align-self:flex-start;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--encre-2);border:1px solid var(--ligne);border-radius:10px;padding:6px 8px;background:var(--surface);min-width:58px}
header .theme svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fond);padding-block:12px 10px;display:flex;align-items:center;gap:12px}
.poteau{width:10px;height:36px;border-radius:5px;background:repeating-linear-gradient(135deg,var(--rouge) 0 6px,var(--surface) 6px 12px,var(--bleu) 12px 18px,var(--surface) 18px 24px);border:1px solid var(--ligne);flex-shrink:0}
.marque{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;letter-spacing:-.01em}
.sous{font-size:12px;color:var(--encre-3)}
.bbs{display:inline-block;vertical-align:middle;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:5px;border:1.5px solid var(--encre);margin-left:4px;background:linear-gradient(90deg,var(--rouge) 0 33%,var(--surface) 33% 66%,var(--bleu) 66%);-webkit-background-clip:text;background-clip:text;color:transparent}
.demo{margin-top:4px;background:var(--rouge-doux);color:var(--rouge);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.demo button{font-weight:700;text-decoration:underline}

nav.bas{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--ligne);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bas .in{max-width:580px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bas button{position:relative}
nav.bas .nb{position:absolute;top:2px;left:calc(50% + 6px);background:var(--rouge);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.rang{font-family:var(--display);font-weight:800;font-size:22px;width:34px;text-align:center;flex-shrink:0;color:var(--bleu)}
.rang.next{color:var(--ok)}
nav.bas button{padding:8px 4px;font-size:12px;font-weight:600;color:var(--encre-3);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bas button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.bas button[aria-pressed="true"]{color:var(--rouge)}

h2{font-family:var(--display);font-weight:800;font-size:20px;margin:22px 0 10px;text-wrap:balance}
h2 small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--encre-3);margin-left:6px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--encre-3);margin:16px 0 8px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--ligne);background:var(--surface);font-size:14px;font-weight:600;color:var(--encre-2)}
.chip[aria-pressed="true"]{border-color:var(--encre);background:var(--encre);color:var(--fond)}
.grille{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tuile{position:relative;background:var(--surface);border:1px solid var(--ligne);border-radius:10px;padding:11px 10px;text-align:left;min-height:72px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;transition:transform .08s}
.tuile:active{transform:scale(.96)}
.tuile .n{font-weight:600;font-size:14px;line-height:1.15}
.tuile .p{font-family:var(--display);font-weight:600;font-size:17px;color:var(--bleu)}
.tuile .s{font-size:11px;color:var(--encre-3)}
.tuile .s.bas{color:var(--alerte);font-weight:700}
.tuile .q{position:absolute;top:-7px;right:-5px;background:var(--rouge);color:#fff;font-weight:700;font-size:13px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 6px}
.tuile:disabled{opacity:.4}

.panier{position:fixed;left:0;right:0;bottom:62px;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--surface);border-top:2px solid var(--encre);box-shadow:0 -6px 18px rgba(20,33,61,.08);padding:10px 16px}
.panier .in{max-width:548px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.lignes{font-size:13px;color:var(--encre-2);max-height:40px;overflow:auto}
.lignes button{color:var(--rouge);font-weight:700;margin-left:2px}
.lignes .libre{width:96px;padding:4px 8px;font-size:13px;display:inline-block;border-color:var(--rouge)}
.lignes{max-height:72px}
.row{display:flex;align-items:center;gap:8px}
.total{margin-left:auto;font-family:var(--display);font-weight:800;font-size:26px}
.go{background:var(--rouge);color:#fff;font-weight:700;border-radius:10px;padding:12px;font-size:16px;flex:1}
.go:disabled{opacity:.35;cursor:not-allowed}
.sec{border:1px solid var(--ligne);border-radius:10px;padding:12px 14px;color:var(--encre-2);background:var(--surface)}

.client{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fid{grid-column:1/-1;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tampons{display:flex;gap:3px}
.tampons i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--bleu)}
.tampons i.on{background:var(--bleu)}
.offert{background:var(--ok-doux);color:var(--ok);border-radius:8px;padding:8px 10px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}

.liste{display:flex;flex-direction:column;border-top:1px solid var(--ligne)}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ligne)}
.li .h{font-size:13px;font-weight:700;width:46px;flex-shrink:0}
.li .d{flex:1;min-width:0;font-size:14px}
.li .d small{display:block;color:var(--encre-3);font-size:12px}
.li .m{font-weight:700}
.li.barre{opacity:.45;text-decoration:line-through}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mini{font-size:12px;padding:6px 9px;border-radius:6px;border:1px solid var(--ligne);color:var(--encre-2);background:var(--surface);white-space:nowrap}
.mini.fort{background:var(--encre);color:var(--fond);border-color:var(--encre)}
.mini.danger{border-color:var(--rouge);color:var(--rouge)}
.pill{white-space:nowrap;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.pill.venu{background:var(--ok-doux);color:var(--ok)}
.pill.absent{background:var(--rouge-doux);color:var(--rouge)}
.vide{color:var(--encre-3);font-size:14px;padding:14px 0}

.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .full{grid-column:1/-1}
.form label.sous{align-self:center}
.btn{background:var(--surface);border:1px solid var(--encre);color:var(--encre);font-weight:700;border-radius:8px;padding:11px}

.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:6px;padding-bottom:2px}
.tabs button{padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--encre-2);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--rouge);box-shadow:inset 0 0 0 1px var(--ligne)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ligne);border:1px solid var(--ligne);border-radius:12px;overflow:hidden;margin-top:12px}
.kpi{background:var(--surface);padding:12px 14px}
.kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--encre-3);font-weight:700}
.kpi .v{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.15;margin-top:2px}
.kpi.fort{grid-column:1/-1}
.kpi.fort .v{font-size:36px;color:var(--rouge)}
.ligneb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:9px 0;border-bottom:1px solid var(--ligne)}
.ligneb small{grid-column:1/-1;color:var(--encre-3);font-size:12px}
.ligneb .t{height:6px;background:var(--fond);border-radius:3px;grid-column:1/-1;overflow:hidden}
.ligneb .t i{display:block;height:100%;background:var(--bleu)}
.ecart{border-radius:10px;padding:12px 14px;margin-top:10px;font-weight:600}
.ecart.ok{background:var(--ok-doux);color:var(--ok)}
.ecart.ko{background:var(--rouge-doux);color:var(--rouge)}
.histo{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:10px;padding-top:18px}
.histo div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.histo i{display:block;width:100%;background:var(--bleu);border-radius:4px 4px 0 0;min-height:2px}
.histo i.auj{background:var(--rouge)}
.histo span{font-size:11px;color:var(--encre-3)}
.histo em{font-style:normal;font-size:10px;color:var(--encre-2)}
.wa{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:700;padding:7px 11px;border-radius:6px;background:#1E8A4C;color:#fff;text-decoration:none;white-space:nowrap}
.wa.fait{background:var(--surface);color:var(--ok);border:1px solid var(--ok)}
a.mini{text-decoration:none;display:inline-flex;align-items:center}
.merci{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ok-doux);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.merci span{flex:1;min-width:150px}
.consent{grid-column:1/-1;font-size:13px;display:flex;gap:8px;align-items:center;color:var(--encre-2)}
.consent input{width:auto;flex-shrink:0}
textarea{min-height:96px;resize:vertical}
.li.clic{width:100%;text-align:left;color:inherit;background:none}
.li.clic:active{background:var(--rouge-doux)}
.pill.neutre{background:var(--fond);color:var(--encre-3);border:1px solid var(--ligne)}
.barre-prog{height:6px;background:var(--fond);border-radius:3px;overflow:hidden;margin:6px 0 10px}
.barre-prog i{display:block;height:100%;background:var(--ok)}
details.mod summary{cursor:pointer;font-weight:700;padding:10px 0}
.simple .grille{grid-template-columns:repeat(2,1fr);gap:10px}
.simple .tuile{min-height:96px;padding:14px 12px}
.simple .tuile .n{font-size:17px}
.simple .tuile .p{font-size:22px}
.simple .chip{padding:12px 18px;font-size:16px}
.simple .go{padding:16px;font-size:18px}
.simple nav.bas button{font-size:13px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph{padding:0;border-radius:10px;overflow:hidden;border:1px solid var(--ligne);background:var(--surface);display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.ph span{font-size:11px;color:var(--encre-3);padding:4px}
.voile{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.voile img{max-width:100%;max-height:78vh;border-radius:10px}
.client.boite{background:var(--surface);border:1px solid var(--ligne);border-radius:12px;padding:10px}
.client.boite.connu{border-color:var(--ok)}
.sugg{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sugg:empty{display:none}
.alerte-code{background:var(--rouge-doux);color:var(--rouge);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.verrou{margin-top:40px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.verrou input{max-width:180px;text-align:center;font-size:24px;letter-spacing:.4em}
.err{color:var(--rouge);font-size:13px;min-height:18px}
.note{font-size:12px;color:var(--encre-3);margin-top:8px}
pre.wa{white-space:pre-wrap;background:var(--surface);border:1px solid var(--ligne);border-radius:8px;padding:12px;font-size:12px;font-family:var(--body);user-select:all}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--encre);color:var(--fond);font-weight:700;padding:10px 18px;border-radius:999px;z-index:9;font-size:14px;max-width:90vw;text-align:center}
.alerte{margin-top:12px;border-radius:10px;padding:10px 12px;background:rgba(180,83,9,.12);color:var(--alerte);font-size:13px;display:flex;flex-direction:column;gap:2px}
.alerte span{color:var(--encre-2)}
.credit{margin-top:36px;padding-top:16px;border-top:1px solid var(--ligne);text-align:center;font-size:12px;color:var(--encre-3);display:flex;flex-direction:column;gap:4px;align-items:center}
.credit p{margin:0}
.sx{display:flex;align-items:baseline;gap:6px;color:var(--encre-2);font-size:12px}
.sxm{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.14em;color:var(--encre)}
.sel{user-select:all;color:var(--encre-2);font-weight:600}
.sign{font-size:11px;color:var(--encre-3);margin-top:2px}
.sign b{letter-spacing:.12em;color:var(--encre-2)}
@media (prefers-reduced-motion:reduce){.tuile{transition:none}}
@media (max-width:360px){.grille{grid-template-columns:repeat(2,1fr)}}
</style>

<script>
// ———— Stockage ————
const mem={};
function lire(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}}
function ecrire(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function effacerTout(){try{Object.keys(localStorage).filter(k=>k.startsWith("bbs3:")).forEach(k=>localStorage.removeItem(k))}catch(e){}Object.keys(mem).forEach(k=>delete mem[k])}

const cleJ=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const F=n=>(n||0).toLocaleString("fr-FR").replace(/ | /g," ")+" F";
const H=t=>new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const telNet=t=>String(t||"").replace(/\D/g,"").slice(-8);

const CATS=["Produits (stock)","Électricité","Loyer","Matériel","Entretien","Salaire","Autre"];

const CONF_DEFAUT={code:"1234",fid:10,par:500,demo:true,salon:"Balila Barber Street",tel:"",
  coiffeurs:[{id:"c1",n:"Kess",pct:50},{id:"c2",n:"?",pct:50}],
  // Tarifs réels relevés sur balila-barber.netlify.app (octobre 2026). p:0 = prix à confirmer au salon, saisi à la caisse.

    {id:"c_simple",cat:"Classiques",n:"Coupe simple",p:1000},{id:"c_zero",cat:"Classiques",n:"Boule à zéro",p:1000},{id:"c_enfant",cat:"Classiques",n:"Coupe simple enfant",p:500},
    {id:"d_classique",cat:"Dégradés",n:"Dégradé classique",p:2000},{id:"d_haut",cat:"Dégradés",n:"Dégradé haut",p:2000},{id:"d_th",cat:"Dégradés",n:"Taper High",p:2000},{id:"d_tm",cat:"Dégradés",n:"Taper Mid",p:2000},{id:"d_tl",cat:"Dégradés",n:"Taper Low",p:2000},{id:"d_drop",cat:"Dégradés",n:"Drop Fade",p:2000},{id:"d_mohawk",cat:"Dégradés",n:"Mohawk Fade",p:2000},{id:"d_waves",cat:"Dégradés",n:"Waves + Fade",p:2000},{id:"d_locs",cat:"Dégradés",n:"Locs + Fade",p:10000},{id:"d_ti",cat:"Dégradés",n:"Dégradé T.I",p:1000},

  joursDuMois().forEach(j=>{const st=stats(j);Object.entries(st.parC).forEach(([id,v])=>{if(r[id])r[id].ca+=v.ca});(j.av||[]).forEach(a=>{if(r[a.coif]){r[a.coif].av+=a.m;r[a.coif].liste.push(a)}})});

function stats(j){
  const v=j.ventes.filter(x=>!x.annule), ca=v.reduce((a,x)=>a+x.total,0), dep=j.dep.reduce((a,x)=>a+x.m,0);
  const pay={}, parC={}; let serv=0, prod=0, cout=0, nCli=0;
  v.forEach(x=>{pay[x.pay]=(pay[x.pay]||0)+x.total;
    const sv=x.items.filter(i=>i.k==="s").reduce((a,i)=>a+i.p*i.q,0)-(x.remise||0), pr=x.items.filter(i=>i.k==="p").reduce((a,i)=>a+i.p*i.q,0);
    cout+=x.items.filter(i=>i.k==="p").reduce((a,i)=>a+(i.c||0)*i.q,0);

    const nc=Math.max(1,x.items.filter(i=>i.k==="s"&&(svc(i.id)||{}).cat!=="Options").reduce((a,i)=>a+i.q,0));nCli+=nc;
    serv+=sv;prod+=pr;parC[x.coif]=parC[x.coif]||{ca:0,n:0};parC[x.coif].ca+=sv;parC[x.coif].n+=nc});
  const esp=pay["Espèces"]||0;
  return{ca,dep,net:ca-dep,n:nCli,enc:v.length,serv,prod,margeP:prod-cout,pay,parC,avances:(j.av||[]).reduce((a,x)=>a+x.m,0),attendu:j.fond==null?null:j.fond+esp-j.dep.filter(d=>d.esp!==false).reduce((a,d)=>a+d.m,0)-(j.av||[]).filter(x=>x.esp!==false).reduce((a,x)=>a+x.m,0)};

  rdv:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  clients:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .6 3 2.8 3 6"/></svg>',
  gerant:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  attente:'<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>'};
function render(){
  if(cleJ()!==cle){cle=cleJ();jour=lire("bbs3:j:"+cle,{ventes:[],dep:[],fond:null,reel:null})}
  const ns=conf.salon||"Mon salon";document.getElementById("nomSalon").textContent=ns;document.getElementById("pourSalon").textContent=ns;
  document.getElementById("initSalon").textContent=ns.split(/\s+/).filter(Boolean).map(w=>w[0].toUpperCase()).slice(0,4).join(".");document.title="Gestion "+ns;
  document.body.classList.toggle("simple",!!conf.simple);
  if(conf.assistant){document.getElementById("bandeau").innerHTML="";document.getElementById("nav").innerHTML="";document.getElementById("panier").hidden=true;document.getElementById("app").innerHTML=vAssistant();document.body.style.paddingBottom="40px";return}
  document.getElementById("date").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  document.getElementById("bandeau").innerHTML=conf.demo?`<div class="demo"><span>Démo SIBYX : vrais tarifs du salon, clients et ventes d'exemple.</span>${confReset?`<button data-reset2>Oui, tout effacer</button><button data-reset0>Annuler</button>`:`<button data-reset>Effacer et démarrer pour de vrai</button>`}</div>`:"";
  const L={caisse:"Caisse",attente:"Attente",rdv:"RDV",clients:"Clients",gerant:"Gérant"},nbAtt=enAttente().length;
  document.getElementById("nav").innerHTML=Object.keys(L).map(k=>`<button data-vue="${k}" aria-pressed="${k===vue}">${ICON[k]}${L[k]}${k==="attente"&&nbAtt?`<span class="nb">${nbAtt}</span>`:""}</button>`).join("");
  const app=document.getElementById("app");
  app.innerHTML=vue==="caisse"?vCaisse():vue==="attente"?vAttente():vue==="rdv"?vRdv():vue==="clients"?vClients():(ouvert?vGerant():vVerrou());
  document.getElementById("panier").hidden=vue!=="caisse";
  document.body.style.paddingBottom=vue==="caisse"?"270px":"110px";
  if(vue==="caisse")rPanier();
  chargerPhotos();
}

const estBas=p=>p.stock!=null&&p.stock<=(p.seuil??2);
const aRacheter=()=>conf.produits.filter(estBas);
function alerteStock(){const l=aRacheter();if(!l.length)return"";
  return`<div class="alerte" role="status"><b>Stock presque épuisé</b><span>${l.map(p=>`${esc(p.n)} (${p.stock})`).join(" · ")}</span></div>`}
function blocClient(){let h="";
  const f=fidelite(ctel), n=telNet(ctel).length===8;
  h+=`<div class="lbl">Client</div><div class="client boite${n?" connu":""}"><input id="ctel" inputmode="tel" placeholder="Téléphone du client" value="${esc(ctel)}"><input id="cnom" placeholder="Prénom (ou chercher un nom)" value="${esc(cnom)}" autocomplete="off"><div id="sugg" class="sugg">${suggestions()}</div>`;
  if(n){h+=`<div class="fid"><span class="tampons">${Array.from({length:conf.fid},(_,i)=>`<i class="${i<f.v%conf.fid?"on":""}"></i>`).join("")}</span><span>${f.c?f.v+" visite"+(f.v>1?"s":""):"Nouveau client"}</span></div>`;
    if(f.pret)h+=`<label class="offert full" style="grid-column:1/-1"><input type="checkbox" id="offrir" ${offrir?"checked":""} style="width:auto"> ${conf.fid}e visite : prestation offerte</label>`;
    if(!f.c||!f.c.anniv)h+=`<input id="cann" inputmode="numeric" placeholder="Anniversaire jj/mm (facultatif)" value="${esc(cann)}" style="grid-column:1/-1">`;
    if(f.c&&f.c.bonus>0&&conf.par)h+=`<label class="offert full" style="grid-column:1/-1"><input type="checkbox" id="cbon" ${cbon?"checked":""} style="width:auto"> Parrainage : −${F(conf.par)} (${f.c.bonus} réduction${f.c.bonus>1?"s":""} à utiliser)</label>`;
    if(!f.c&&conf.par)h+=`<input id="cpar" inputmode="tel" placeholder="Envoyé par un client ? Son numéro (facultatif)" value="${esc(cpar)}" style="grid-column:1/-1">`;
    if(!f.c||!f.c.ok)h+=`<label class="consent"><input type="checkbox" id="cok" ${cok?"checked":""}> Le client accepte de recevoir les messages du salon sur WhatsApp (promos, rappels)</label>`;}
  if(!n)h+=`<p class="note" style="grid-column:1/-1;margin:0">Tapez le numéro : le client est enregistré tout seul à l'encaissement et sa visite compte pour la fidélité.</p>`;
  h+=`</div>`;
  return h}
function suggestions(){const d=String(ctel||"").replace(/\D/g,""),q=(cnom||"").trim().toLowerCase();if(d.length===8)return"";
  let l=[];if(d.length>=3)l=listeCli().filter(c=>c.t.includes(d.slice(-8)));else if(q.length>=2)l=listeCli().filter(c=>(c.nom||"").toLowerCase().includes(q));
  l=l.sort((a,b)=>(b.der||0)-(a.der||0)).slice(0,4);
  return l.length?`<span class="sous">Déjà client ?</span>`+l.map(c=>`<button class="chip" data-pick="${c.t}">${esc(c.nom||"Sans nom")} · ${esc(c.t)}</button>`).join(""):""}
function vCaisse(){
  let h=alerteStock();
  const f=fidelite(ctel);
  if(dernier&&clients[dernier]){const c={t:dernier,...clients[dernier]};h+=`<div class="merci"><span>Encaissé pour <b>${esc(c.nom||c.t)}</b>. Lui envoyer un merci sur WhatsApp ?</span><a class="wa" href="${waLien(c.t,texteMsg("merci",c))}" target="_blank" rel="noopener" data-env="merci|${c.t}">Envoyer</a><label class="mini" for="phIn" data-phpour="${c.t}" style="cursor:pointer">📷 Photo</label><button class="mini" data-nomerci>Non</button></div>`;
    if(dernierPar&&clients[dernierPar]){const pa={t:dernierPar,...clients[dernierPar]};h+=`<div class="merci"><span><b>${esc(pa.nom||pa.t)}</b> a envoyé ce client : il gagne −${F(conf.par)} sur sa prochaine visite. Le lui dire ?</span><a class="wa" href="${waLien(pa.t,remplir("Merci {prenom} de nous avoir envoyé "+(prenom(c)||"un ami")+" ! 🙏 Ta prochaine visite chez {salon} : "+F(conf.par)+" de réduction.",pa))}" target="_blank" rel="noopener" data-env="par|${pa.t}">Envoyer</a></div>`}}
  if(sansNum!=null){const x=jour.ventes.find(v=>v.t===sansNum&&!v.tel&&!v.annule);if(x)h+=`<div class="merci"><span>Encaissé <b>sans client</b>. L'enregistrer maintenant ?</span><div class="form full" style="width:100%"><input id="lierTel" inputmode="tel" placeholder="Téléphone"><input id="lierNom" placeholder="Prénom" value="${esc(x.nom||"")}"><button class="btn" data-lierok="${x.t}">Enregistrer</button><button class="mini" data-nosans>Non merci</button></div></div>`}
  h+=`<div class="lbl">Coiffeur</div><div class="chips">${actifs(conf.coiffeurs).map(c=>`<button class="chip" data-coif="${c.id}" aria-pressed="${c.id===coif}">${esc(c.n)}</button>`).join("")}</div>`;
  h+=blocClient();
  const cats=[...new Set(conf.services.map(s=>s.cat||"Autres"))];
  cats.forEach(c=>{h+=`<div class="lbl">${esc(c)}</div><div class="grille">${conf.services.filter(s=>(s.cat||"Autres")===c).map(s=>{const q=panier.filter(i=>i.k==="s"&&i.id===s.id).reduce((a,i)=>a+i.q,0);
    return`<button class="tuile" data-add="s:${s.id}"><span class="n">${esc(s.n)}</span><span class="p num">${s.p?s.p.toLocaleString("fr-FR"):`<span class="s">Prix à confirmer</span>`}</span>${q?`<span class="q">${q}</span>`:""}</button>`}).join("")}</div>`});
  h+=`<div class="lbl">Produits</div><div class="grille">${conf.produits.map(p=>{const q=panier.filter(i=>i.k==="p"&&i.id===p.id).reduce((a,i)=>a+i.q,0);const inconnu=p.stock==null,rest=inconnu?1:p.stock-q,b=estBas(p);
    return`<button class="tuile" data-add="p:${p.id}" ${rest<=0?"disabled":""}><span class="n">${esc(p.n)}</span><span class="p num">${p.p.toLocaleString("fr-FR")}</span><span class="s${b?" bas":""}">${inconnu?"Stock à compter":p.stock<=0?"Rupture":b?"Plus que "+p.stock:"Stock : "+p.stock}</span>${q?`<span class="q">${q}</span>`:""}</button>`}).join("")}</div>`;
  const v=[...jour.ventes].reverse();
  h+=`<h2>Passages du jour <small>${(n=>n+" client"+(n>1?"s":""))(stats(jour).n)}</small></h2><div class="liste">`;
  h+=v.length?v.map(x=>`<div class="li${x.annule?" barre":""}"><span class="h num">${H(x.t)}</span><span class="d">${x.items.map(i=>(i.q>1?i.q+"× ":"")+esc(i.n)).join(", ")}<small>${esc(coifN(x.coif))} · ${x.pay}${x.nom?" · "+esc(x.nom):""}${x.remise?(x.parr?" · parrainage":" · fidélité"):""}</small></span><span class="m num">${F(x.total)}</span>${x.annule?"":`${x.tel?"":`<button class="mini fort" data-lier="${x.t}">+ N°</button>`}<button class="mini${confAnnul===x.t?" danger":""}" data-annul="${x.t}">${confAnnul===x.t?"Confirmer":"Annuler"}</button>`}</div>${lierT===x.t?`<div class="form" style="padding:8px 0 12px;border-bottom:1px solid var(--ligne)"><input id="lierTel" inputmode="tel" placeholder="Téléphone du client"><input id="lierNom" placeholder="Prénom" value="${esc(x.nom||"")}"><button class="btn full" data-lierok="${x.t}">Compter cette visite pour ce client</button></div>`:""}`).join(""):`<div class="vide">Aucun passage encore. Choisissez le coiffeur puis la prestation.</div>`;
  return h+"</div>";
}

function rPanier(){
  const t=totalPanier(), manque=panier.some(i=>i.libre&&!(i.p>0)), ok=panier.length&&coif&&!manque;
  document.getElementById("panier").innerHTML=`<div class="in">
    ${panier.length?(telNet(ctel).length===8?`<div class="sous">👤 <b>${esc(cnom||telNet(ctel))}</b> · ${(clients[telNet(ctel)]||{}).v||0} visite(s) avant celle-ci</div>`:`<button class="sous" data-allerclient style="text-align:left;color:var(--alerte);font-weight:700">👤 Pas de client : toucher ici pour l'ajouter</button>`):""}
    <div class="lignes">${panier.length?panier.map((i,x)=>`${i.q>1?i.q+"× ":""}${esc(i.n)}${i.libre?` <input class="libre" id="libre${x}" data-libre="${x}" type="number" inputmode="numeric" placeholder="Prix F" value="${i.p||""}" aria-label="Prix de ${esc(i.n)}">`:""}<button data-moins="${x}" aria-label="Retirer">−</button>`).join(" · "):"Ticket vide"}${rdvLie?" · <b>RDV</b>":""}</div>
    <div class="row"><div class="chips">${PAIES.map(p=>`<button class="chip" data-paie="${p}" aria-pressed="${p===paie}">${p}</button>`).join("")}</div><span class="total num" id="totalP">${F(t)}</span></div>
    <div class="row">${panier.length?`<button class="sec" data-vider>Vider</button>`:""}<button class="go" id="goBtn" data-encaisser ${ok?"":"disabled"}>${panier.length&&!coif?"Choisir le coiffeur":manque?"Indiquer le prix":"Encaisser"}</button></div></div>`;
}

// ———— File d'attente du jour ————
const enAttente=()=>(jour.att||[]).filter(x=>x.st!=="fini");
function vAttente(){
  const l=enAttente(),nbC=Math.max(1,actifs(conf.coiffeurs).length),du=conf.duree||20;
  let h=`<h2>File d'attente <small>${l.length} personne${l.length>1?"s":""}</small></h2><div class="form"><input id="qNom" placeholder="Prénom"><input id="qTel" inputmode="tel" placeholder="Téléphone (facultatif)">
    <div class="chips full"><button class="chip" data-qcoif="" aria-pressed="${!qCoif}">Peu importe</button>${actifs(conf.coiffeurs).map(c=>`<button class="chip" data-qcoif="${c.id}" aria-pressed="${qCoif===c.id}">${esc(c.n)}</button>`).join("")}</div>
    <button class="go full" data-addq>Ajouter à la file</button></div>`;
  h+=`<div class="liste" style="margin-top:14px">`+(l.length?l.map((x,i)=>{const min=Math.round((Date.now()-x.t)/60000),av=Math.floor(i/nbC)*du,c=clients[x.tel]||{nom:x.nom,v:0};
    return`<div class="li"><span class="rang${i<nbC?" next":""}">${i+1}</span><span class="d"><b>${esc(x.nom)}</b>${x.coif?" · pour "+esc(coifN(x.coif)):""}<small>Arrivé à ${H(x.t)} (${min} min) · ${i<nbC?`<b style="color:var(--ok)">c'est le prochain</b>`:"environ "+av+" min d'attente"}</small></span>
      <span class="acts">${x.tel?`<a class="wa" href="${waLien(x.tel,remplir("Bonjour {prenom}, c'est bientôt ton tour chez {salon} ! Tu peux venir. 💈",{...c,nom:x.nom}))}" target="_blank" rel="noopener">Prévenir</a>`:""}<button class="mini fort" data-qgo="${x.id}">À lui</button><button class="mini" data-qdel="${x.id}" aria-label="Retirer ${esc(x.nom)} de la file">Parti</button></span></div>`}).join(""):`<div class="vide">Personne n'attend. Ajoutez les clients qui arrivent sans rendez-vous.</div>`)+`</div>`;
  h+=`<p class="note">« À lui » ouvre la caisse avec son prénom et son coiffeur. L'attente est estimée avec ${du} min par client et ${nbC} coiffeur${nbC>1?"s":""} (réglable dans Réglages).</p>`;
  return h;
}
function vRdv(){
  const auj=cleJ(), list=rdv.filter(r=>r.date>=auj).sort((a,b)=>(a.date+a.h).localeCompare(b.date+b.h));
  let h=`<h2>Nouveau rendez-vous</h2><div class="form">
    <input id="rDate" type="date" value="${auj}"><input id="rH" type="time" value="10:00">
    <input id="rNom" placeholder="Prénom du client"><input id="rTel" inputmode="tel" placeholder="Téléphone">
    <select id="rS">${conf.services.map(s=>`<option value="${s.id}">${esc(s.n)}</option>`).join("")}</select>
    <select id="rC">${actifs(conf.coiffeurs).map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join("")}</select>
    <button class="btn full" data-addrdv>Ajouter le rendez-vous</button></div>
    <p class="note">Ajoutez ici aussi les réservations reçues en ligne.</p>`;
  const groupes={};list.forEach(r=>(groupes[r.date]=groupes[r.date]||[]).push(r));
  if(!list.length)h+=`<h2>À venir</h2><div class="vide">Aucun rendez-vous prévu.</div>`;
  Object.entries(groupes).forEach(([d,rs])=>{
    h+=`<h2>${d===auj?"Aujourd'hui":new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})} <small>${rs.length} RDV</small></h2><div class="liste">`;
    h+=rs.map(r=>`<div class="li"><span class="h num">${r.h}</span><span class="d">${esc(r.nom)} ${r.st!=="prevu"?`<span class="pill ${r.st}">${r.st==="venu"?"Venu":"Absent"}</span>`:""}<small>${esc((svc(r.sid)||{n:"?"}).n)} · ${esc(coifN(r.coif))}${r.tel?" · "+esc(r.tel):""}</small></span>
      <span class="acts">${r.st==="prevu"?`${d===auj?`<button class="mini fort" data-venu="${r.id}">Encaisser</button><button class="mini" data-absent="${r.id}">Absent</button>`:""}<button class="mini" data-rappel="${r.id}">Rappel</button>`:""}<button class="mini danger" data-delrdv="${r.id}">×</button></span></div>`).join("")+`</div>`;
  });
  h+=`<div id="rappelZone"></div>`;
  return h;
}

function vClients(){
  if(ficheTel&&clients[ficheTel])return vFiche(ficheTel);
  const tous=listeCli(),lim=Date.now()-(conf.absJ||30)*JOUR,FI={tous:"Tous",ok:"Acceptent les messages",sans:"Sans accord",abs:"Absents"};
  let arr=tous.filter(c=>!recherche||c.t.includes(recherche)||(c.nom||"").toLowerCase().includes(recherche.toLowerCase()));
  if(filtreC==="ok")arr=arr.filter(c=>c.ok);if(filtreC==="sans")arr=arr.filter(c=>!c.ok);if(filtreC==="abs")arr=arr.filter(c=>c.der&&c.der<lim);
  arr.sort((a,b)=>(b.v||0)-(a.v||0));
  let h=`<h2>Clients <small>${tous.length} enregistrés · ${tous.filter(c=>c.ok).length} acceptent les messages</small></h2><input id="cherche" placeholder="Chercher un nom ou un numéro" value="${esc(recherche)}">`;
  h+=`<div class="chips" style="margin-top:8px">${Object.entries(FI).map(([k,l])=>`<button class="chip" data-filtre="${k}" aria-pressed="${k===filtreC}">${l}</button>`).join("")}</div>`;
  h+=`<p class="note">Touchez un client pour voir sa fiche. La ${conf.fid}e visite est offerte.</p><div class="liste" style="margin-top:8px">`;
  h+=arr.length?arr.map(c=>{const r=(c.v||0)%conf.fid;return`<button class="li clic" data-fiche="${c.t}"><span class="d">${esc(c.nom||"Sans nom")} ${c.ok?"":`<span class="pill neutre">sans accord</span>`}<small>${esc(c.t)} · ${c.der?"dernière visite "+dateC(c.der):"jamais venu"}${c.dep?" · "+F(c.dep):""}</small></span><span class="acts" style="flex-direction:column;align-items:flex-end;gap:4px"><span class="tampons">${Array.from({length:conf.fid},(_,i)=>`<i class="${i<r?"on":""}"></i>`).join("")}</span><span class="sous">${c.v||0} visite${(c.v||0)>1?"s":""}${r===conf.fid-1?" · <b style=\"color:var(--ok)\">prochaine offerte</b>":""}</span></span></button>`}).join(""):`<div class="vide">Aucun client trouvé.</div>`;
  h+=`</div><h2>Ajouter un client</h2><p class="note">Pour un client qui passe maintenant, utilisez plutôt la case Client de la <b>caisse</b> : la visite est comptée toute seule.</p><div class="form"><input id="ncT" inputmode="tel" placeholder="Téléphone (8 chiffres)"><input id="ncN" placeholder="Prénom"><input id="ncA" inputmode="numeric" placeholder="Anniversaire jj/mm (facultatif)"><input id="ncV" type="number" min="0" inputmode="numeric" placeholder="Visites déjà faites (facultatif)"><label class="consent"><input type="checkbox" id="ncO"> Accepte de recevoir les messages du salon sur WhatsApp</label><button class="btn full" data-addcli>Ajouter</button></div>`;
  return h;
}
function vFiche(t){
  const c={t,...clients[t]},hist=historique(t);
  let h=`<button class="mini" data-fiche="" style="margin-top:12px">← Tous les clients</button><h2>${esc(c.nom||"Sans nom")} <small>${esc(t)}</small></h2>`;
  h+=`<div class="kpis"><div class="kpi"><div class="l">Visites</div><div class="v num">${c.v||0}</div></div><div class="kpi"><div class="l">Total dépensé</div><div class="v num">${F(c.dep||0)}</div></div>
    <div class="kpi"><div class="l">Dernière visite</div><div class="v" style="font-size:17px">${c.der?dateC(c.der):"—"}</div></div><div class="kpi"><div class="l">Coiffeur habituel</div><div class="v" style="font-size:17px">${c.coif?esc(coifN(c.coif)):"—"}</div></div></div>`;
  if(c.filleuls||c.par||c.bonus)h+=`<p class="note">${c.filleuls?`A amené <b>${c.filleuls}</b> client${c.filleuls>1?"s":""}. `:""}${c.bonus?`<b style="color:var(--ok)">${c.bonus} réduction${c.bonus>1?"s":""} de ${F(conf.par)}</b> à utiliser. `:""}${c.par&&clients[c.par]?`Envoyé par ${esc(clients[c.par].nom||c.par)}.`:""}</p>`;
  h+=`<div class="acts" style="justify-content:flex-start;margin-top:12px"><a class="wa" href="${waLien(t)}" target="_blank" rel="noopener">Écrire sur WhatsApp</a><a class="mini" href="tel:+223${t}">Appeler</a><a class="mini" href="${waLien(t,remplir("Bonjour {prenom}, voici ta carte fidélité {salon} : {carte}",c))}" target="_blank" rel="noopener">Envoyer sa carte</a></div>`;
  h+=`<h2>Infos</h2><div class="form"><input id="fN" class="full" placeholder="Prénom et nom" value="${esc(c.nom||"")}"><input id="fA" class="full" inputmode="numeric" placeholder="Anniversaire jj/mm" value="${c.anniv?esc(c.anniv.split("-").reverse().join("/")):""}">
    <label class="consent"><input type="checkbox" id="fO" ${c.ok?"checked":""}> Accepte de recevoir les messages du salon (décocher si le client a répondu STOP)</label>
    <textarea id="fNote" class="full" placeholder="Notes : coupe préférée, remarques…">${esc(c.note||"")}</textarea><button class="btn full" data-savefiche="${t}">Enregistrer</button></div>`;
  const ps=passagesSansNumero(c);
  if(ps.length)h+=`<div class="merci" style="display:block"><b>${ps.length} passage${ps.length>1?"s":""} encaissé${ps.length>1?"s":""} sans numéro au nom « ${esc(prenom(c)||c.nom)} »</b><div class="sous" style="margin:2px 0 8px">Si c'était bien ce client, touchez « C'est lui » : la visite est ajoutée à sa carte.</div><div class="liste">`+ps.slice(0,10).map(({k,v})=>`<div class="li"><span class="h num">${dateC(v.t)}</span><span class="d">${v.items.map(i=>esc(i.n)).join(", ")}<small>${esc(coifN(v.coif))} · ${F(v.total)}</small></span><button class="mini fort" data-cestlui="${k}|${v.t}">C'est lui</button></div>`).join("")+`</div></div>`;
  h+=`<h2>Visites</h2>`+(ouvert?`<div class="row"><button class="mini" data-vis="-1" aria-label="Retirer une visite">−1</button><b class="num" style="font-size:22px;min-width:40px;text-align:center">${c.v||0}</b><button class="mini" data-vis="1" aria-label="Ajouter une visite">+1</button><span class="sous">Correction par le gérant (ex. ancienne carte papier)</span></div>`:`<p class="note">Il manque des visites ? Le gérant peut les corriger ici après avoir ouvert l'espace Gérant avec son code.</p>`);
  h+=`<h2>Photos des coupes</h2><label class="btn" for="phIn" style="display:block;text-align:center;cursor:pointer" data-phpour="${t}">📷 Prendre une photo</label><div id="photos" class="photos" data-tel="${t}"></div>`;
  h+=`<h2>Dernières visites <small>${hist.length}</small></h2><div class="liste">`+(hist.length?hist.map(v=>`<div class="li"><span class="h num">${dateC(v.t)}</span><span class="d">${v.items.map(i=>(i.q>1?i.q+"× ":"")+esc(i.n)).join(", ")}<small>${esc(coifN(v.coif))} · ${v.pay}</small></span><span class="m num">${F(v.total)}</span></div>`).join(""):`<div class="vide">Aucune visite enregistrée sur cette tablette.</div>`)+`</div>`;
  h+=`<p class="note" style="margin-top:22px">Le client demande à être effacé ? Supprimez sa fiche : son nom et son numéro disparaissent (les montants des ventes restent dans les bilans).</p><button class="mini danger" data-supcli="${t}">${confSup?"Confirmer la suppression":"Supprimer ce client"}</button>`;
  return h;
}

    h+=`<h2>Le salon</h2><div class="form"><input id="gSalon" class="full" placeholder="Nom du salon" value="${esc(conf.salon||"")}"><input id="gTel" class="full" inputmode="tel" placeholder="Numéro WhatsApp du salon (8 chiffres)" value="${esc(conf.tel||"")}">

function bilanTexte(){
  const s=stats(jour);let t=`${conf.salon} ·${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}\n\nRecette : ${F(s.ca)} (${s.n} clients)\n• Prestations : ${F(s.serv)}\n• Produits : ${F(s.prod)}\n`;
  PAIES.forEach(p=>{if(s.pay[p])t+=`• ${p} : ${F(s.pay[p])}\n`});
  t+=`\nPar coiffeur :\n`;conf.coiffeurs.forEach(c=>{const v=s.parC[c.id];if(v)t+=`• ${c.n} : ${v.n} clients, ${F(v.ca)}\n`});
  t+=`\nBénéfice sur les produits : ${F(s.margeP)}`;
  t+=`\nDépenses : ${F(s.dep)}\nReste : ${F(s.net)}`;
  const bas=aRacheter();if(bas.length)t+=`\n\nÀ racheter : ${bas.map(p=>p.n+" ("+p.stock+")").join(", ")}`;
  if(s.avances)t+=`\nAvances aux coiffeurs : ${F(s.avances)}`;
  if(s.attendu!=null&&jour.reel!=null){const e=jour.reel-s.attendu;t+=`\nCaisse : ${e===0?"juste":"écart "+(e>0?"+":"")+F(e)}`}
  return t+`\n\n— Bilan généré par l'application SIBYX`;
}

  if(a.delrdv){rdv=rdv.filter(x=>x.id!==a.delrdv);saveR();return render()}
  if(a.rappel){const r=rdv.find(x=>x.id===a.rappel),d=new Date(r.date+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
    const txt=`Bonjour ${r.nom.replace(" (exemple)","")}, c'est ${conf.salon}.Petit rappel : votre rendez-vous (${(svc(r.sid)||{n:""}).n}) est prévu ${r.date===cleJ()?"aujourd'hui":"le "+d} à ${r.h} avec ${coifN(r.coif)}. À tout à l'heure !`;
    document.getElementById("rappelZone").innerHTML=`<h2>Message de rappel</h2><pre class="wa" id="rapTxt">${esc(txt)}</pre><p class="note">${r.tel?"À envoyer au "+esc(r.tel)+" sur WhatsApp.":"Pas de numéro enregistré pour ce client."}</p>`;
    copier(txt,"rapTxt");document.getElementById("rappelZone").scrollIntoView({behavior:"smooth"});return}
  if("ouvrir" in a){if(document.getElementById("code").value===conf.code){ouvert=true;onglet="bilan";render()}else document.getElementById("err").textContent="Code incorrect";return}
  if("fermer" in a){ouvert=false;vue="caisse";return render()}
  if(a.tab){confDel=null;editProd=null;onglet=a.tab;return render()}
  if("dep" in a){const m=+document.getElementById("dM").value;if(!(m>0)){toast("Indiquez un montant");return}jour.dep.push({t:Date.now(),cat:document.getElementById("dCat").value,m,note:document.getElementById("dN").value.trim(),esp:document.getElementById("dEsp").checked});saveJ();toast("Dépense enregistrée");return render()}
  if(a.deldep){jour.dep.splice(+a.deldep,1);saveJ();return render()}
  if("caisse" in a){const f=document.getElementById("fond").value,r=document.getElementById("reel").value;jour.fond=f===""?null:+f;jour.reel=r===""?null:+r;saveJ();toast("Caisse enregistrée");return render()}
  if(a.stock){const[i,d]=a.stock.split(":").map(Number);const p=conf.produits[i];p.stock=Math.max(0,(p.stock??0)+d);saveConf();return render()}
  if(a.seuil!==undefined){const p=conf.produits[+a.seuil];p.seuil=((p.seuil??2)+1)%6;saveConf();return render()}
  if("achat" in a){const p=conf.produits.find(x=>x.id===document.getElementById("aP").value),q=+document.getElementById("aQ").value,m=+document.getElementById("aM").value,esp=document.getElementById("aEsp").checked;
    if(!p||!(q>0)||!(m>=0)||document.getElementById("aM").value===""){toast("Indiquez la quantité et le prix payé");return}
    p.stock=(p.stock??0)+q;p.achat=Math.round(m/q);conf.achats=conf.achats||[];conf.achats.push({t:Date.now(),id:p.id,n:p.n,q,m});saveConf();
    if(m>0){jour.dep.push({t:Date.now(),cat:"Produits (stock)",m,note:"Achat "+q+" × "+p.n,esp});saveJ()}
    toast(q+" × "+p.n+" ajouté"+(q>1?"s":"")+" au stock");return render()}
  if("addprod" in a){const n=document.getElementById("npN").value.trim(),p=+document.getElementById("npP").value,s=+document.getElementById("npS").value||0,lot=+document.getElementById("npA").value||0;if(!n||!(p>0)){toast("Nom et prix de vente obligatoires");return}
    conf.produits.push({id:uid(),n,p,achat:lot,stock:s,seuil:Math.min(2,s)});saveConf();toast("Produit ajouté");return render()}
  if(a.editprod){editProd=editProd===a.editprod?null:a.editprod;confDel=null;return render()}
  if(a.saveprod){const p=conf.produits.find(x=>x.id===a.saveprod),pv=+document.getElementById("epP").value,pa=+document.getElementById("epA").value;if(!(pv>0)){toast("Prix de vente obligatoire");return}
    p.n=document.getElementById("epN").value.trim()||p.n;p.p=pv;p.achat=pa>=0?pa:0;saveConf();editProd=null;toast("Produit enregistré"+(pa>pv?" · attention : acheté plus cher que vendu":""));return render()}
  if(a.delprod){if(confDel!=="p:"+a.delprod){confDel="p:"+a.delprod;return render()}conf.produits=conf.produits.filter(x=>x.id!==a.delprod);panier=panier.filter(i=>!(i.k==="p"&&i.id===a.delprod));editProd=null;confDel=null;saveConf();toast("Produit supprimé");return render()}
  if(a.assist){
    if(a.assist==="1"){const n=document.getElementById("waSalon").value.trim(),t=telNet(document.getElementById("waTel").value);if(!n){toast("Écrivez le nom du salon");return}if(t&&t.length!==8){toast("Numéro à 8 chiffres");return}conf.salon=n;conf.tel=t;etapeA=2}
    else if(a.assist==="2"){const noms=[...document.querySelectorAll("[data-wac]")].map(x=>x.value.trim()).filter(Boolean);if(!noms.length){toast("Écrivez au moins un coiffeur");return}
      const anc=actifs(conf.coiffeurs);anc.forEach((c,k)=>{if(noms[k])c.n=noms[k];else c.off=true});noms.slice(anc.length).forEach(n=>conf.coiffeurs.push({id:"c"+uid(),n,pct:50}));etapeA=3}
    else if(a.assist==="plus"){const l=document.getElementById("waListe");const x=document.createElement("input");x.dataset.wac="";x.placeholder="Nom du coiffeur";l.appendChild(x);x.focus();return}
    else if(a.assist==="3"){const v=document.getElementById("waCode").value.trim(),v2=document.getElementById("waCode2").value.trim();if(!/^\d{4,8}$/.test(v)){toast("4 à 8 chiffres");return}if(v!==v2){toast("Les deux codes sont différents");return}if(v==="1234"){toast("Choisissez un autre code que 1234");return}
      conf.code=v;conf.assistant=false;etapeA=1;saveConf();toast("C'est prêt !");vue="caisse";ouvert=false;return render()}
    else if(a.assist==="retour"){etapeA=Math.max(1,etapeA-1)}
    saveConf();return render()}
  if("savecoif" in a){actifs(conf.coiffeurs).forEach(c=>{c.n=document.getElementById("cn_"+c.id).value.trim()||c.n;c.pct=+document.getElementById("cp_"+c.id).value});saveConf();toast("Coiffeurs enregistrés");return render()}
  if("addcoif" in a){const n=document.getElementById("ncoif").value.trim();if(!n){toast("Écrivez le nom");return}conf.coiffeurs.push({id:"c"+uid(),n,pct:50});saveConf();toast(n+" ajouté");return render()}
  if(a.delcoif){if(confDel!=="c:"+a.delcoif){confDel="c:"+a.delcoif;return render()}if(actifs(conf.coiffeurs).length<2){toast("Il faut au moins un coiffeur");confDel=null;return render()}const c=conf.coiffeurs.find(x=>x.id===a.delcoif);c.off=true;if(coif===c.id)coif=null;confDel=null;saveConf();toast(c.n+" retiré (son historique reste)");return render()}
  if(a.delsvc){if(confDel!=="s:"+a.delsvc){confDel="s:"+a.delsvc;return render()}conf.services=conf.services.filter(x=>x.id!==a.delsvc);panier=panier.filter(i=>!(i.k==="s"&&i.id===a.delsvc));confDel=null;saveConf();toast("Prestation supprimée");return render()}
  if("addsvc" in a){const n=document.getElementById("nsN").value.trim(),pr=+document.getElementById("nsP").value||0;let ct=document.getElementById("nsC").value;if(ct==="__new")ct=document.getElementById("nsCN").value.trim();if(!n){toast("Écrivez le nom");return}if(!ct){toast("Écrivez le nom de la catégorie");return}
    conf.services.push({id:"s"+uid(),cat:ct,n,p:pr});saveConf();toast("Prestation ajoutée");return render()}
  if("savesalon" in a){const n=document.getElementById("gSalon").value.trim(),t=telNet(document.getElementById("gTel").value);if(!n){toast("Écrivez le nom du salon");return}if(t&&t.length!==8){toast("Numéro à 8 chiffres");return}
    conf.salon=n;conf.tel=t;conf.simple=document.getElementById("gSimple").checked;conf.duree=+document.getElementById("gDuree").value;conf.ouv=document.getElementById("gOuv").value||"09:00";conf.ferm=document.getElementById("gFerm").value||"21:00";saveConf();toast("Enregistré");return render()}
  if("savesvc" in a){conf.services.forEach(s=>{const en=document.getElementById("sn_"+s.id);if(!en)return;s.n=en.value.trim()||s.n;const p=+document.getElementById("sp_"+s.id).value;if(p>=0)s.p=p});saveConf();toast("Prix enregistrés");return render()}
  if("savefid" in a){conf.fid=+document.getElementById("fidN").value;conf.par=+document.getElementById("parM").value;saveConf();toast("Fidélité mise à jour");return render()}
  if("code" in a){const old=document.getElementById("ac").value.trim(),v=document.getElementById("nc").value.trim(),v2=document.getElementById("nc2").value.trim();if(old!==conf.code){toast("Code actuel incorrect");return}if(!/^\d{4,8}$/.test(v)){toast("4 à 8 chiffres");return}if(v!==v2){toast("Les deux codes sont différents");return}if(v==="1234"){toast("Choisissez un autre code que 1234");return}conf.code=v;saveConf();toast("Code changé");return render()}
  if(a.copier){copier(bilanTexte(),a.copier);return}
});
render();
// ———— Bouton clair / sombre ————
const THEMES=[["auto","Auto"],["soir","Le soir"],["clair","Clair"],["sombre","Sombre"]];
const TICON={auto:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  soir:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/><path d="M3 21h18"/></svg>',
  clair:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  sombre:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'};
let themeMode=(()=>{try{return localStorage.getItem("bbs3:theme")||"auto"}catch(e){return"auto"}})();
function majTheme(){themeApplique(themeMode);const b=document.getElementById("themeBtn");if(b)b.innerHTML=TICON[themeMode]+THEMES.find(t=>t[0]===themeMode)[1]}
majTheme();setInterval(()=>{if(themeMode==="soir")themeApplique("soir")},60000);
document.addEventListener("click",e=>{if(!e.target.closest("[data-theme-btn]"))return;const i=THEMES.findIndex(t=>t[0]===themeMode);themeMode=THEMES[(i+1)%THEMES.length][0];
  try{localStorage.setItem("bbs3:theme",themeMode)}catch(x){}majTheme();toast({auto:"Auto : suit le réglage de l'appareil",soir:"Sombre le soir (19 h – 7 h)",clair:"Toujours clair",sombre:"Toujours sombre"}[themeMode])});

// Hors-ligne : l'appli reste disponible sans connexion
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
